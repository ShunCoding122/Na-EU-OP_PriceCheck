name: Build Windows desktop app

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check desktop source
        run: npm run desktop:check

      - name: Build portable Windows executable
        run: npm run desktop:package:win

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: op-market-compare-windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
